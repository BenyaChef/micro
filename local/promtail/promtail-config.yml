server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: micro
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=micro"]

    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

    pipeline_stages:
      # Логи сервисов — JSON от slog. Инфраструктурные контейнеры шлют
      # обычный текст, поэтому парсим только то, что похоже на JSON.
      - match:
          selector: '{service=~"auth|blog|notification"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  time: time
                  error_code: error_code
            # Grafana распознаёт уровень по строчным значениям,
            # а slog пишет INFO/ERROR заглавными.
            - template:
                source: level
                template: '{{ ToLower .Value }}'
            - labels:
                level:
            - timestamp:
                source: time
                format: RFC3339Nano
