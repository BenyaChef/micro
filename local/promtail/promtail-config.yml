server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: micro
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=micro"]

    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

    pipeline_stages:
      - match:
          selector: '{service=~"auth|blog|notification"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  time: time
                  service: service
                  method: method
                  path: path
                  status: status
                  took: took
                  error_code: error_code
                  request_id: request_id
                  user_id: user_id
                  event_id: event_id

            - template:
                source: level
                template: '{{ ToLower .Value }}'

            - labels:
                level:

            - timestamp:
                source: time
                format: RFC3339Nano

            - structured_metadata:
                msg:
                method:
                path:
                status:
                took:
                error_code:
                request_id:
                user_id:
                event_id:

            - template:
                source: pretty
                template: >-
                  {{- if eq .level "error" }}{{ printf "\x1b[1;31m" }}
                  {{- else if eq .level "warn" }}{{ printf "\x1b[1;33m" }}
                  {{- else }}{{ printf "\x1b[90m" }}{{ end }}
                  {{- printf "%-5s\x1b[0m " (ToUpper .level) }}
                  {{- printf "\x1b[35m%-12s\x1b[0m " .service }}
                  {{- printf "\x1b[1m%s\x1b[0m" .msg }}
                  {{- if and .method .path }}{{ printf " \x1b[1;36m%s\x1b[0m \x1b[94m%s\x1b[0m" .method .path }}{{ end }}
                  {{- if .status }}{{ printf " -> %s" .status }}{{ end }}
                  {{- if .took }}{{ printf " \x1b[90m%s\x1b[0m" .took }}{{ end }}
                  {{- if .request_id }}{{ printf " \x1b[32mreq=%s\x1b[0m" .request_id }}{{ end }}
                  {{- if .user_id }}{{ printf " \x1b[32muser=%s\x1b[0m" .user_id }}{{ end }}
                  {{- if .event_id }}{{ printf " \x1b[32mevent=%s\x1b[0m" .event_id }}{{ end }}
                  {{- if .error_code }}{{ printf " \x1b[1;31m[%s]\x1b[0m" .error_code }}{{ end }}

            - output:
                source: pretty
