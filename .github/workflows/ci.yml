name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  POSTGRES_DSN: postgres://micro:micro@localhost:5432/micro?sslmode=disable

jobs:
  verify:
    name: Сборка, линтер и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: |
            common/go.sum
            infrastructure/go.sum
            auth/go.sum
            blog/go.sum
            notification/go.sum

      - name: Поднять postgres и kafka
        run: make up-infra

      - name: Миграции
        run: make migrate

      - name: Сборка
        run: make build

      - name: go vet
        run: make vet

      - name: Установить golangci-lint
        run: |
          GOWORK=off go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint
        run: make lint

      - name: Тесты с живой базой
        run: make test-integration

      - name: Соседние модули не попали в require
        run: |
          if grep -n 'BenyaChef/micro/\(common\|infrastructure\|auth\|blog\|notification\)' */go.mod | grep -v ':1:module'; then
            echo "Соседние модули должны резолвиться через go.work, а не require"
            exit 1
          fi

      - name: Манифесты собираются
        run: |
          set -euo pipefail
          for service in auth blog notification; do
            for stage in develop production; do
              docker run --rm -v "$PWD:/w:ro" -w /w \
                registry.k8s.io/kustomize/kustomize:v5.4.3 build "$service/deploy/$stage" > /dev/null
              echo "  ok $service/$stage"
            done
          done

      - name: Секреты не закоммичены
        run: |
          set -euo pipefail
          if grep -rn --include='secret.yaml' -E '^\s{2}[A-Z_]+: ' */deploy/*/ | grep -v 'REPLACE_ME'; then
            echo "В secret.yaml попало реальное значение"
            exit 1
          fi
          echo "  в secret.yaml только заглушки"

      - name: Логи инфраструктуры при падении
        if: failure()
        run: make logs | tail -100

  images:
    name: Сборка образов
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, blog, notification]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Собрать образ ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          tags: micro-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
