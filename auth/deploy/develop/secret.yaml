# ЗАГЛУШКА. Значения сюда не коммитим.
#
# В эталоне здесь ExternalSecret, который тянет значения из AWS Parameter Store.
# У нас менеджера секретов нет, поэтому реальные значения кладутся в кластер
# отдельно, например:
#
#   kubectl -n develop create secret generic auth-micro \
#     --from-literal=POSTGRES_DSN='postgres://...' \
#     --from-literal=JWT_SECRET='...'
#
# Этот файл нужен, чтобы kustomize build проходил и структура была видна.
apiVersion: v1
kind: Secret
metadata:
  name: auth-micro
type: Opaque
stringData:
  POSTGRES_DSN: REPLACE_ME
  JWT_SECRET: REPLACE_ME
