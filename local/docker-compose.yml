name: micro

services:
  postgres:
    image: postgres:17-alpine
    container_name: micro-postgres
    environment:
      POSTGRES_DB: micro
      POSTGRES_USER: micro
      POSTGRES_PASSWORD: micro
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micro -d micro"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: micro-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: micro-local-cluster-0001
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: micro-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: micro-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: local/Dockerfile.migrate
    container_name: micro-migrate
    environment:
      POSTGRES_DSN: postgres://micro:micro@postgres:5432/micro?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  auth:
    build:
      context: ..
      dockerfile: auth/Dockerfile
    container_name: micro-auth
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: info
      REST_PORT: "8081"
      METRICS_PORT: "9101"
      GRPC_PORT: "9091"
      POSTGRES_DSN: postgres://micro:micro@postgres:5432/micro?sslmode=disable
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      JWT_TTL: 1h
      PASSWORD_HASH_COST: "10"
      KAFKA_BROKERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  blog:
    build:
      context: ..
      dockerfile: blog/Dockerfile
    container_name: micro-blog
    ports:
      - "8082:8082"
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: info
      REST_PORT: "8082"
      METRICS_PORT: "9102"
      POSTGRES_DSN: postgres://micro:micro@postgres:5432/micro?sslmode=disable
      AUTH_GRPC_ADDR: auth:9091
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  notification:
    build:
      context: ..
      dockerfile: notification/Dockerfile
    container_name: micro-notification
    ports:
      - "8083:8083"
    environment:
      ENVIRONMENT: docker
      LOG_LEVEL: info
      REST_PORT: "8083"
      METRICS_PORT: "9103"
      POSTGRES_DSN: postgres://micro:micro@postgres:5432/micro?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: notification-service
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: micro-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      auth:
        condition: service_healthy
      blog:
        condition: service_healthy
      notification:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: micro-grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/micro.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
