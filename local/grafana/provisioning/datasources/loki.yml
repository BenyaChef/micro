apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: micro-loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 2000
      derivedFields:
        - name: request_id
          matcherType: regex
          matcherRegex: 'req=([0-9a-f-]{36})'
          url: '{service=~"auth|blog|notification"} |= "$${__value.raw}"'
          datasourceUid: micro-loki
          urlDisplayLabel: Все строки этого запроса
