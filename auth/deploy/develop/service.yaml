apiVersion: v1
kind: Service
metadata:
  name: auth-micro
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9101"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app: auth-micro
  ports:
    - name: api
      protocol: TCP
      port: 8081
      targetPort: 8081
    - name: grpc
      protocol: TCP
      port: 9091
      targetPort: 9091
    - name: metrics
      protocol: TCP
      port: 9101
      targetPort: 9101
