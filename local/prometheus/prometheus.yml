global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: auth
    static_configs:
      - targets: ["auth:9101"]

  - job_name: blog
    static_configs:
      - targets: ["blog:9102"]

  - job_name: notification
    static_configs:
      - targets: ["notification:9103"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
