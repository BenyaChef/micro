apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-micro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-micro
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 180
    scaleDown:
      stabilizationWindowSeconds: 300
